<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>Safiya — Speaking Tutor</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{--bg:#0f0f10;--card:#1a1a1c;--card2:#232326;--line:#2c2c30;--txt:#f2f2f2;--mut:#9a9a9f;--accent:#c9a84c;--accentbg:#2a2416;--green:#3ecf8e;--greenbg:#14291f;--red:#e05555;--redbg:#2a1414;}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;min-height:100vh;}
  .wrap{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}
  .scr{flex:1;padding:24px 20px;display:flex;flex-direction:column;}
  h1{font-size:19px;font-weight:600;margin-bottom:4px;}
  .sub{font-size:13px;color:var(--mut);margin-bottom:22px;}
  .lvl{display:flex;flex-direction:column;gap:10px;}
  .lvl button{text-align:left;padding:15px 16px;border-radius:12px;font-size:15px;font-weight:500;background:var(--card);color:var(--txt);border:1px solid var(--line);cursor:pointer;transition:.15s;}
  .lvl button:active{transform:scale(.98);background:var(--card2);}
  .center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;}
  .circle{width:100px;height:100px;border-radius:50%;background:var(--accentbg);display:flex;align-items:center;justify-content:center;margin-bottom:18px;}
  .circle svg{width:40px;height:40px;stroke:var(--accent);}
  .big{font-size:21px;font-weight:600;}
  .timer{font-size:32px;font-weight:600;margin:16px 0;font-variant-numeric:tabular-nums;}
  .btn{padding:12px 30px;border-radius:12px;font-size:15px;font-weight:500;background:var(--card);color:var(--txt);border:1px solid var(--line);cursor:pointer;}
  .btn:active{transform:scale(.98);}
  .row{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
  .av{width:44px;height:44px;border-radius:50%;background:var(--greenbg);color:var(--green);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:17px;}
  .qcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:auto;}
  .qlabel{font-size:11px;letter-spacing:.05em;color:var(--mut);margin-bottom:8px;}
  .qtext{font-size:17px;line-height:1.5;}
  .qbtn{margin-top:14px;padding:9px 16px;border-radius:10px;font-size:13px;background:var(--card2);color:var(--txt);border:1px solid var(--line);cursor:pointer;}
  .actions{display:flex;gap:10px;margin-top:20px;}
  .actions button{flex:1;padding:15px;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;border:1px solid var(--line);}
  .skip{background:var(--card);color:var(--txt);}
  .end{background:var(--redbg);color:var(--red);border-color:#3a1c1c;}
  .mic{margin-left:auto;font-size:13px;color:var(--mut);}
  .err{color:var(--red);font-size:13px;text-align:center;margin-top:10px;}
</style>
</head>
<body>
<div class="wrap"><div class="scr" id="scr"></div></div>
<script>
// ---- CONFIG: set this to your Railway backend URL after deploy ----
const API = window.__API__ || location.origin;

const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
if (tg) { tg.ready(); tg.expand(); }

// user id + name from Telegram (fallback to a random guest for browser testing)
const U = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) || null;
const UID = U ? String(U.id) : ("guest_" + Math.random().toString(36).slice(2,8));
const NAME = U ? (U.first_name || "Student") : "Guest";

const LEVELS = [["beginner","Beginner"],["elementary","Elementary"],["pre_intermediate","Pre-Intermediate"],["intermediate","Intermediate"],["advanced","Advanced"]];
const QS = ["What did you do last weekend?","Do you prefer the city or the countryside? Why?","What's a skill you'd like to learn, and why?","Describe your favourite meal in detail.","Is social media good or bad for society?","If you had a free day tomorrow, what would you do?","What kind of music do you enjoy?","Tell me about a place you'd love to visit."];

const scr = document.getElementById("scr");
let pollTimer=null, countTimer=null, searchTimer=null;

function clearTimers(){ [pollTimer,countTimer,searchTimer].forEach(t=>t&&clearInterval(t)); pollTimer=countTimer=searchTimer=null; }

async function api(path, body){
  const r = await fetch(API + path, {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  return r.json();
}

function levelScreen(){
  clearTimers();
  scr.innerHTML = `<h1>Find a speaking partner</h1><div class="sub">Pick your level to get matched with another student</div><div class="lvl" id="lv"></div>`;
  const box = document.getElementById("lv");
  LEVELS.forEach(([id,label])=>{
    const b=document.createElement("button");
    b.textContent = label;
    b.onclick=()=>startSearch(id,label);
    box.appendChild(b);
  });
}

async function startSearch(levelId, label){
  clearTimers();
  scr.innerHTML = `<div class="center">
    <div class="circle"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg></div>
    <div class="big">Finding a partner…</div>
    <div class="sub" style="max-width:230px;margin:6px 0 0;">Looking for someone at ${label} level to practice with</div>
    <div class="timer" id="tmr">2:00</div>
    <button class="btn" id="cancel">Cancel</button>
    <div class="err" id="err"></div>
  </div>`;
  document.getElementById("cancel").onclick = ()=>{ api("/leave",{uid:UID}); levelScreen(); };

  let res;
  try { res = await api("/join",{uid:UID,name:NAME,level:levelId}); }
  catch(e){ document.getElementById("err").textContent="Connection error. Try again."; return; }

  if(res.matched){ return callScreen(label,res.room,res.partner_name); }

  // countdown + poll for a match
  let t=120; const tmr=document.getElementById("tmr");
  countTimer=setInterval(()=>{ t--; if(!document.getElementById("tmr")){clearInterval(countTimer);return;} tmr.textContent=`${Math.floor(t/60)}:${String(t%60).padStart(2,"0")}`; if(t<=0){ clearTimers(); api("/leave",{uid:UID}); noPartner(label,levelId);} },1000);
  pollTimer=setInterval(async()=>{
    try{ const p=await api("/poll",{uid:UID}); if(p.matched){ clearTimers(); callScreen(label,p.room,p.partner_name);} }catch(e){}
  },2000);
}

function noPartner(label,levelId){
  scr.innerHTML=`<div class="center">
    <div class="circle"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M12 8v4M12 16h.01"/><circle cx="12" cy="12" r="9"/></svg></div>
    <div class="big">No one's here yet</div>
    <div class="sub" style="max-width:240px;margin:6px 0 14px;">No ${label} partner available right now. Try again in a bit!</div>
    <button class="btn" onclick="location.reload()" style="margin-bottom:10px;">Try again</button>
  </div>`;
}

function callScreen(label,room,partnerName){
  clearTimers();
  let q=Math.floor(Math.random()*QS.length);
  const render=()=>{
    scr.innerHTML=`
    <div class="row">
      <div class="av">${(partnerName||"P")[0].toUpperCase()}</div>
      <div><div style="font-size:15px;font-weight:600;">Connected · ${partnerName||"Partner"}</div><div style="font-size:12px;color:var(--green);">● ${label} · live</div></div>
      <div class="mic" id="ct">00:00</div>
    </div>
    <div class="qcard">
      <div class="qlabel">TALK ABOUT</div>
      <div class="qtext">${QS[q]}</div>
      <button class="qbtn" id="nextq">↻ Next question</button>
    </div>
    <div style="font-size:12px;color:var(--mut);text-align:center;margin:14px 0;">🔊 Voice connects here (next step). Room: <code style="font-size:11px;">${room}</code></div>
    <div class="actions">
      <button class="skip" id="skip">⏭ Skip</button>
      <button class="end" id="end">✕ End</button>
    </div>`;
    document.getElementById("nextq").onclick=()=>{q=(q+1)%QS.length;render();};
    document.getElementById("skip").onclick=async()=>{ await api("/skip",{uid:UID}); startSearch(label.toLowerCase().replace(/[- ]/g,"_"),label); };
    document.getElementById("end").onclick=async()=>{ await api("/leave",{uid:UID}); levelScreen(); };
    let s=0; countTimer=setInterval(()=>{s++;const e=document.getElementById("ct");if(!e){clearInterval(countTimer);return;}e.textContent=`${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`;},1000);
  };
  render();
}

levelScreen();
</script>
</body>
</html>
