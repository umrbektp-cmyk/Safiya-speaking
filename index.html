<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>Safiya Speaking</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/livekit-client@2.5.7/dist/livekit-client.umd.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<style>
  :root{--bg:#faf7f0;--card:#fff;--line:#efe8d6;--line2:#e8dfc8;--navy:#1a2b4a;--gold:#d4af37;--goldbg:#f5ecd0;--golddk:#8a6d1b;--mut:#8a8266;--mut2:#b0a780;--green:#1d9e75;--red:#a32d2d;--redbg:#fbeaea;}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  body{background:var(--bg);color:var(--navy);min-height:100vh;}
  .wrap{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding-bottom:66px;}
  .top{background:var(--card);padding:12px 16px;border-bottom:1px solid var(--line);text-align:center;position:sticky;top:0;z-index:10;}
  .top .t{font-size:15px;font-weight:600;} .top .s{font-size:10px;color:var(--mut2);}
  .scr{flex:1;padding:20px 18px;}
  h2{font-size:18px;font-weight:600;margin-bottom:4px;} .sub{font-size:13px;color:var(--mut);}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;}
  .btn{padding:13px;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--navy);text-align:center;width:100%;}
  .btn:active{transform:scale(.98);} .btn-gold{background:var(--gold);color:#fff;border:none;} .btn-red{background:var(--redbg);color:var(--red);border:1px solid #eecaca;} .btn-green{background:var(--green);color:#fff;border:none;}
  .av{border-radius:50%;background:var(--navy);color:var(--gold);display:flex;align-items:center;justify-content:center;font-weight:600;overflow:hidden;flex-shrink:0;}
  .av img{width:100%;height:100%;object-fit:cover;}
  .lvlbadge{display:inline-block;background:var(--goldbg);color:var(--golddk);font-size:12px;padding:3px 12px;border-radius:20px;}
  .nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:flex;background:var(--card);border-top:1px solid var(--line);}
  .nav div{flex:1;text-align:center;padding:9px 0;color:var(--mut2);cursor:pointer;font-size:10px;} .nav div.on{color:var(--gold);} .nav i{font-size:20px;display:block;}
  .center{display:flex;flex-direction:column;align-items:center;text-align:center;} .row{display:flex;align-items:center;gap:12px;}
  .tab{flex:1;text-align:center;padding:7px;border-radius:20px;font-size:12px;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--mut);} .tab.on{background:var(--gold);color:#fff;border:none;font-weight:600;}
  .star{cursor:pointer;font-size:34px;color:#e0d6b8;} .star.on{color:var(--gold);}
  .err{color:var(--red);font-size:13px;text-align:center;margin-top:10px;}
  .toggle{width:44px;height:26px;border-radius:20px;position:relative;cursor:pointer;transition:.2s;flex-shrink:0;}
  .toggle .knob{width:20px;height:20px;background:#fff;border-radius:50%;position:absolute;top:3px;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.2);}
  textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:14px;resize:none;color:var(--navy);}
  .cbtn{width:56px;height:56px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer;}
</style>
</head>
<body>
<div class="wrap">
  <div class="top" style="position:relative;"><div class="t">Safiya Speaking</div><div class="s">by Umrbek TP</div>
    <div id="bell" onclick="notifScreen()" style="position:absolute;right:14px;top:12px;cursor:pointer;"><i class="ti ti-bell" style="font-size:22px;color:var(--navy);"></i><span id="belldot" style="display:none;position:absolute;top:-2px;right:-2px;width:9px;height:9px;background:var(--red);border-radius:50%;"></span></div>
  </div>
  <div class="scr" id="scr"></div>
</div>
<div class="nav" id="nav">
  <div data-tab="speak" class="on" onclick="go('speak')"><i class="ti ti-microphone"></i>Speak</div>
  <div data-tab="chat" onclick="go('chat')"><i class="ti ti-messages"></i>Chat</div>
  <div data-tab="ranks" onclick="go('ranks')"><i class="ti ti-trophy"></i>Ranks</div>
  <div data-tab="profile" onclick="go('profile')"><i class="ti ti-user"></i>Profile</div>
</div>
<script>
const API=window.__API__||location.origin;
const tg=window.Telegram&&window.Telegram.WebApp?window.Telegram.WebApp:null;
if(tg){tg.ready();tg.expand();}
const U=(tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user)||null;
let _gid=null;try{_gid=localStorage.getItem("sp_guest");if(!_gid){_gid="guest_"+Math.random().toString(36).slice(2,8);localStorage.setItem("sp_guest",_gid);}}catch(e){_gid="guest_"+Math.random().toString(36).slice(2,8);}
const UID=U?String(U.id):_gid;
const NAME=U?[U.first_name,U.last_name].filter(Boolean).join(" "):"Guest";
const PHOTO=U&&U.photo_url?U.photo_url:"";
const LEVELS=[["beginner","Beginner"],["elementary","Elementary"],["pre_intermediate","Pre-Intermediate"],["intermediate","Intermediate"],["advanced","Advanced"]];
const QS=["What did you do last weekend?","Do you prefer the city or the countryside? Why?","What's a skill you'd like to learn, and why?","Describe your favourite meal in detail.","Is social media good or bad for society?","If you had a free day tomorrow, what would you do?","What kind of music do you enjoy?","Tell me about a place you'd love to visit.","Has your hometown changed much in recent years?","What's the best film you've seen lately?","What did you want to be when you were a child?","Do you think money can buy happiness?","What's your favourite way to relax?","Describe your best friend.","Is it better to travel alone or with others?","What's a book that changed how you think?","How do you usually spend your evenings?","What's the most beautiful place in your country?","Do you prefer tea or coffee, and why?","What would you do if you won a lot of money?","Should students learn a foreign language? Why?","What's your favourite season and why?","Describe a memorable birthday.","Is technology making us more or less connected?","What food from another country do you love?","What's something you're proud of?","Do you like cooking? What can you make?","How important is it to keep learning as an adult?","What's your dream job?","Describe your ideal weekend.","Do you prefer summer or winter holidays?","What's a habit you'd like to change?","Should people retire early if they can?","What makes a good teacher?","Tell me about a festival in your culture.","Is it better to live in a big city or a small town?","What's the best advice you've ever received?","How do you deal with stress?","What's your favourite childhood memory?","Do you think everyone should exercise? Why?","What language would you like to learn next?","Describe a person you admire.","Is online learning as good as classroom learning?","What's your favourite kind of weather?","How do you like to celebrate good news?","What's one thing you can't live without?","Should children have smartphones? At what age?","Describe a place where you feel calm.","What's a goal you have for this year?","Do you enjoy shopping? Online or in stores?","What's the most useful app on your phone?","How has your taste in music changed over time?","What would your perfect house look like?","Is it important to follow the news? Why?","What's a tradition your family has?","Do you prefer planning or being spontaneous?","What's the hardest part of learning English?","Describe a time you helped someone.","What's your favourite thing about your job or studies?","If you could meet anyone, who would it be?"];
let myLevel=localStorage.getItem("sp_level")||"beginner";
let onlyLevel=localStorage.getItem("sp_only")==="1";

const scr=document.getElementById("scr");
let pollTimer=null,countTimer=null,statusTimer=null,reqTimer=null,incomingTimer=null,lkRoom=null,callSeconds=0,muted=false;
function clearTimers(){[pollTimer,countTimer,statusTimer,reqTimer].forEach(t=>t&&clearInterval(t));pollTimer=countTimer=statusTimer=reqTimer=null;}
async function api(p,b){const r=await fetch(API+p,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b||{})});return r.json();}
function avatar(name,photo,size){const s=size||44;return `<div class="av" style="width:${s}px;height:${s}px;font-size:${Math.round(s*0.4)}px;">${photo?'<img src="'+photo+'"/>':(name||"?")[0].toUpperCase()}</div>`;}
function fmt(sec){return `${String(Math.floor(sec/60)).padStart(2,"0")}:${String(sec%60).padStart(2,"0")}`;}
function lvlName(l){return (l||"").replace(/_/g," ").replace(/\b\w/g,c=>c.toUpperCase());}

// background: incoming call-request watcher (runs on speak home)
function watchIncoming(){
  if(incomingTimer) clearInterval(incomingTimer);
  incomingTimer=setInterval(async()=>{
    try{const p=await api("/poll",{uid:UID});if(p.incoming){clearInterval(incomingTimer);incomingScreen(p.incoming);}}catch(e){}
  },3000);
}

function go(tab){
  clearTimers();currentTab=tab;inCall=false;
  document.querySelectorAll(".nav div").forEach(d=>d.classList.toggle("on",d.dataset.tab===tab));
  document.getElementById("nav").style.display="flex";
  if(tab==="speak")speakHome();else if(tab==="chat")chatScreen();else if(tab==="ranks")ranksScreen();else if(tab==="profile")profileScreen();
}

async function speakHome(){
  clearTimers();
  let online=0;try{const o=await api("/online",{});online=o.count||0;}catch(e){}
  scr.innerHTML=`<div class="center" style="padding-top:14px;">
    <div style="width:104px;height:104px;border-radius:50%;background:var(--goldbg);display:flex;align-items:center;justify-content:center;margin:14px 0 14px;border:2px solid var(--gold);">
      <div style="width:68px;height:68px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;"><i class="ti ti-microphone" style="font-size:28px;color:#fff;"></i></div></div>
    <h2>Choose how to practice</h2>
    <div class="card" style="margin-top:10px;padding:7px 14px;font-size:12px;color:var(--green);font-weight:600;">\u25CF ${online} online now</div>
    <div style="width:100%;margin-top:18px;display:flex;flex-direction:column;gap:10px;">
      <button class="btn btn-gold" id="freebtn" style="padding:16px;"><i class="ti ti-microphone"></i> Free talk</button>
      <button class="btn" id="rpbtn" style="padding:16px;border:1px solid var(--navy);color:var(--navy);"><i class="ti ti-masks-theater"></i> Roleplay</button>
    </div>
    <div class="card" style="width:100%;margin-top:14px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;">
      <div style="text-align:left;"><div style="font-size:13px;font-weight:600;">My level only</div><div style="font-size:11px;color:var(--mut);">${onlyLevel?"On \u00B7 "+lvlName(myLevel):"Off \u00B7 match all levels"}</div></div>
      <div class="toggle" id="oltog" style="background:${onlyLevel?'var(--gold)':'#e0d6b8'};"><div class="knob" style="${onlyLevel?'right:3px;':'left:3px;'}"></div></div>
    </div>
    <div style="width:100%;margin-top:22px;">
      <div style="font-size:13px;font-weight:600;color:var(--navy);text-align:center;margin-bottom:10px;">What do learners say about Safiya AI?</div>
      <div id="revcard" style="min-height:96px;"></div>
      <div style="text-align:center;margin-top:10px;"><span id="sharexp" style="color:var(--gold);font-weight:600;font-size:13px;cursor:pointer;">\u270D\uFE0F Share your experience</span></div>
    </div></div>`;
  document.getElementById("freebtn").onclick=()=>startSearch("free");
  document.getElementById("rpbtn").onclick=()=>startSearch("roleplay");
  document.getElementById("oltog").onclick=()=>{onlyLevel=!onlyLevel;localStorage.setItem("sp_only",onlyLevel?"1":"0");speakHome();};
  document.getElementById("sharexp").onclick=shareExperienceScreen;
  loadTestimonials();
  watchIncoming();
}

let _revList=[],_revIdx=0,_revTimer=null;
async function loadTestimonials(){
  let res;try{res=await api("/reviews",{});}catch(e){}
  _revList=(res&&res.reviews)||[];
  const card=document.getElementById("revcard");if(!card)return;
  if(!_revList.length){card.innerHTML=`<div class="card" style="padding:14px;text-align:center;color:var(--mut);font-size:12px;">Be the first to share your experience \uD83D\uDC9B</div>`;return;}
  _revIdx=0;renderTestimonial();
  if(_revTimer)clearInterval(_revTimer);
  if(_revList.length>1)_revTimer=setInterval(()=>{_revIdx=(_revIdx+1)%_revList.length;renderTestimonial();},4000);
}
function renderTestimonial(){
  const card=document.getElementById("revcard");if(!card)return;
  const r=_revList[_revIdx];const stars="\u2B50".repeat(Math.max(1,Math.min(5,r.stars||5)));
  card.innerHTML=`<div class="card" style="padding:13px;transition:opacity .3s;">
    <div class="row" style="gap:8px;margin-bottom:6px;">${avatar(r.name,r.photo_url,32)}<div style="flex:1;"><div style="font-size:13px;font-weight:600;color:var(--navy);">${escapeHtml(r.name)}</div><div style="font-size:11px;">${stars}</div></div><div style="font-size:10px;color:var(--mut2);">${r.created||""}</div></div>
    <div style="font-size:13px;color:var(--navy);line-height:1.4;">${escapeHtml(r.text)}</div></div>`;
}
function shareExperienceScreen(){
  if(_revTimer)clearInterval(_revTimer);
  document.getElementById("nav").style.display="none";
  let stars=5;
  scr.innerHTML=`<button class="btn" style="width:auto;padding:7px 14px;font-size:13px;border:none;color:var(--mut);margin-bottom:10px;" onclick="go('speak')">\u2039 Back</button>
    <h2>Share your experience</h2><div class="sub">Tell others how Safiya helped you. Your review is checked before it's shown.</div>
    <div style="margin:18px 0 8px;font-size:13px;color:var(--navy);">Your rating</div>
    <div id="rvstars" style="display:flex;gap:8px;margin-bottom:16px;"></div>
    <textarea id="rvtext" rows="4" maxlength="400" placeholder="e.g. My confidence has grown so much, I can speak English much better now!"></textarea>
    <button class="btn btn-gold" id="rvsubmit" style="margin-top:12px;">Submit review</button>
    <div class="sub" id="rvmsg" style="text-align:center;margin-top:10px;"></div>`;
  const sb=document.getElementById("rvstars");
  for(let i=1;i<=5;i++){const s=document.createElement("i");s.className="ti ti-star star on";s.onclick=()=>{stars=i;[...sb.children].forEach((c,idx)=>c.classList.toggle("on",idx<i));};sb.appendChild(s);}
  document.getElementById("rvsubmit").onclick=async()=>{
    const t=document.getElementById("rvtext").value.trim();if(!t){document.getElementById("rvmsg").textContent="Please write something first.";return;}
    await api("/review_submit",{uid:UID,name:NAME,photo:PHOTO,stars:stars,text:t});
    scr.innerHTML=`<div class="center" style="padding-top:80px;"><div style="width:70px;height:70px;border-radius:50%;background:var(--goldbg);display:flex;align-items:center;justify-content:center;margin-bottom:16px;"><i class="ti ti-check" style="font-size:32px;color:var(--gold);"></i></div><h2>Thank you!</h2><div class="sub" style="max-width:240px;margin-top:8px;">Your review was sent for approval. It'll appear once confirmed.</div><button class="btn" style="width:auto;margin-top:20px;padding:11px 26px;" onclick="go('speak')">Back to home</button></div>`;
  };
}

let searchMode="free";
async function startSearch(mode){
  if(mode)searchMode=mode;
  clearTimers();if(incomingTimer)clearInterval(incomingTimer);
  document.getElementById("nav").style.display="none";
  const rp=searchMode==="roleplay";
  scr.innerHTML=`<div class="center" style="padding-top:60px;">
    <div style="width:96px;height:96px;border-radius:50%;background:var(--goldbg);display:flex;align-items:center;justify-content:center;margin-bottom:18px;"><i class="ti ${rp?'ti-masks-theater':'ti-search'}" style="font-size:36px;color:var(--gold);"></i></div>
    <h2>${rp?'Finding a roleplay partner\u2026':'Finding a partner\u2026'}</h2><div class="sub" id="qmsg" style="max-width:230px;margin-top:6px;">${onlyLevel?"Looking for "+lvlName(myLevel)+" learners":"Connecting you with anyone online"}</div>
    <div style="font-size:30px;font-weight:600;margin:18px 0;" id="tmr">2:00</div>
    <button class="btn" style="width:auto;padding:10px 28px;" onclick="api('/leave',{uid:UID});go('speak')">Cancel</button>
    <div class="err" id="err"></div></div>`;
  let res;try{res=await api("/join",{uid:UID,name:NAME,photo:PHOTO,level:myLevel,only_level:onlyLevel,mode:searchMode});}catch(e){document.getElementById("err").textContent="Connection error.";return;}
  if(res.matched)return callScreen(res);
  if(res.queue_pos>1)document.getElementById("qmsg").textContent="You're next \u2014 waiting for someone to free up";
  let t=120;const tmr=document.getElementById("tmr");
  countTimer=setInterval(()=>{t--;if(!document.getElementById("tmr")){clearInterval(countTimer);return;}tmr.textContent=`${Math.floor(t/60)}:${String(t%60).padStart(2,"0")}`;if(t<=0){clearTimers();api("/leave",{uid:UID});noPartner();}},1000);
  pollTimer=setInterval(async()=>{try{const p=await api("/poll",{uid:UID});if(p.matched){clearTimers();callScreen(p);}else if(p.incoming){clearTimers();api("/leave",{uid:UID});incomingScreen(p.incoming);}}catch(e){}},1500);
}

function noPartner(){
  const rp=searchMode==="roleplay";
  scr.innerHTML=`<div class="center" style="padding-top:60px;">
    <div style="width:96px;height:96px;border-radius:50%;background:var(--goldbg);display:flex;align-items:center;justify-content:center;margin-bottom:16px;"><i class="ti ti-clock" style="font-size:34px;color:var(--gold);"></i></div>
    <h2>No one's here yet</h2><div class="sub" style="max-width:250px;margin:6px 0 16px;">${rp?'No roleplay partner right now. Invite someone to challenge them!':'Nobody free right now. Try again in a bit.'}</div>
    ${rp?'<button class="btn btn-gold" style="width:auto;padding:12px 28px;margin-bottom:8px;" onclick="invitePickerScreen()"><i class=\"ti ti-user-plus\"></i> Invite someone</button>':''}
    <button class="btn" style="width:auto;padding:11px 26px;margin-bottom:8px;" onclick="startSearch()">Try again</button>
    <button class="btn" style="width:auto;padding:11px 26px;border:none;color:var(--mut);" onclick="go('speak')">Back</button></div>`;
}

// Roleplay: pick who to invite — online users or your friends
async function invitePickerScreen(){
  document.getElementById("nav").style.display="none";
  scr.innerHTML=`<button class="btn" style="width:auto;padding:7px 14px;font-size:13px;border:none;color:var(--mut);margin-bottom:10px;" onclick="startSearch('roleplay')">\u2039 Back</button>
    <h2>Invite to Roleplay</h2><div class="sub">Challenge someone to a roleplay \uD83C\uDFAD</div>
    <div style="font-size:12px;color:var(--mut2);margin:16px 0 8px;">PEOPLE YOU FOLLOW</div>
    <div id="invfr"><div class="sub" style="text-align:center;padding:14px;">Loading\u2026</div></div>
    <div style="font-size:12px;color:var(--mut2);margin:18px 0 8px;">TOP LEARNERS</div>
    <div id="invtop"><div class="sub" style="text-align:center;padding:14px;">Loading\u2026</div></div>`;
  // friends
  let fr;try{fr=await api("/friends",{uid:UID});}catch(e){}
  const friends=(fr&&fr.friends)||[];
  const fbox=document.getElementById("invfr");
  fbox.innerHTML=friends.length?friends.map(f=>inviteRow(f)).join(""):`<div class="sub" style="padding:6px 0;">You're not following anyone yet.</div>`;
  // leaderboard as "anybody"
  let lb;try{lb=await api("/leaderboard",{kind:"minutes"});}catch(e){}
  const top=((lb&&lb.board)||[]).filter(x=>x.uid!==UID).slice(0,15);
  const tbox=document.getElementById("invtop");
  tbox.innerHTML=top.length?top.map(f=>inviteRow(f)).join(""):`<div class="sub" style="padding:6px 0;">No one yet.</div>`;
}
function inviteRow(f){
  const on=f.online?'<span style="color:var(--green);font-size:11px;">\u25CF online</span>':'';
  return `<div class="row" style="padding:9px 6px;border-bottom:1px solid var(--line);">${avatar(f.name,f.photo_url,36)}<div style="flex:1;"><div style="font-size:14px;font-weight:600;">${escapeHtml(f.name||"Learner")}</div><div>${on} ${lvlName(f.level)}</div></div><button class="btn btn-gold" style="width:auto;padding:7px 14px;font-size:12px;" onclick="sendRoleplayInvite('${f.uid}','${escapeHtml(f.name||"")}')">Invite</button></div>`;
}
async function sendRoleplayInvite(uid,name){
  document.getElementById("nav").style.display="none";
  scr.innerHTML=`<div class="center" style="padding-top:70px;">
    <div style="width:70px;height:70px;border-radius:50%;background:var(--goldbg);display:flex;align-items:center;justify-content:center;margin-bottom:14px;"><i class="ti ti-masks-theater" style="font-size:28px;color:var(--gold);"></i></div>
    <h2>Invite sent</h2><div class="sub" style="max-width:220px;margin-top:6px;">Waiting for ${name||"them"} to accept the roleplay\u2026</div>
    <div class="err" id="err"></div>
    <button class="btn" style="width:auto;padding:10px 26px;margin-top:20px;border:none;color:var(--mut);" onclick="api('/leave',{uid:UID});go('speak')">Cancel</button></div>`;
  let res;try{res=await api("/roleplay_invite",{uid:UID,name:NAME,photo:PHOTO,target_uid:uid});}catch(e){document.getElementById("err").textContent="Failed to send.";return;}
  if(!res.ok){document.getElementById("err").textContent=res.reason==="busy"?"They're in a call now.":"Couldn't send.";return;}
  reqTimer=setInterval(async()=>{try{const c=await api("/request_check",{uid:UID});if(c.accepted){clearInterval(reqTimer);callScreen(c);}}catch(e){}},2000);
}

const STICKERS=["👏","🔥","😂","❤️","👍","🎉","😮","🙌"];
function callScreen(m){
  clearTimers();callSeconds=0;muted=false;inCall=true;_curMatch=m;
  const liked={v:false};
  document.getElementById("nav").style.display="none";
  const label=lvlName(m.partner_level);let q=Math.floor(Math.random()*QS.length);
  const isRP=m.mode==="roleplay"&&m.scenario;
  // Build the topic/scenario card
  let topicCard;
  if(isRP){
    const sc=m.scenario;
    // my side: 'a' sees sideA role + secretA; 'b' sees sideB role + secretB
    const meSideA=m.my_side==="a";
    const myRole=meSideA?sc.a:sc.b;
    const mySecret=meSideA?sc.sa:sc.sb;
    const theirRole=meSideA?sc.b:sc.a;
    topicCard=`<div class="card" id="rpcard" style="padding:16px;margin-top:16px;">
      <div style="font-size:10px;letter-spacing:.08em;color:var(--mut2);margin-bottom:6px;">🎭 ROLEPLAY · ${sc.t}</div>
      <div style="font-size:14px;line-height:1.5;color:var(--navy);margin-bottom:10px;">${sc.s}</div>

// ─── Reactions (small, non-distracting) ───
function showReaction(sticker,mine){
  const el=document.createElement("div");
  el.textContent=sticker;
  el.style.cssText=`position:fixed;bottom:${mine?150:200}px;${mine?'right:40px':'left:40px'};font-size:30px;z-index:999;pointer-events:none;transition:all 1.4s ease-out;opacity:1;`;
  document.body.appendChild(el);
  requestAnimationFrame(()=>{el.style.bottom=(mine?260:310)+"px";el.style.opacity="0";});
  setTimeout(()=>el.remove(),1400);
}
function sendReaction(sticker){
  try{if(lkRoom&&lkRoom.localParticipant){const data=new TextEncoder().encode(JSON.stringify({type:"reaction",s:sticker}));lkRoom.localParticipant.publishData(data,{reliable:false});}}catch(e){}
}
function sendData(obj){try{if(lkRoom&&lkRoom.localParticipant){lkRoom.localParticipant.publishData(new TextEncoder().encode(JSON.stringify(obj)),{reliable:true});}}catch(e){}}

// ─── Roleplay: change topic mid-call (confirm handshake) ───
let _curMatch=null,_pendingTopic=null;
async function proposeNewTopic(m){
  _curMatch=m;
  let res;try{res=await api("/roleplay_scenario",{});}catch(e){return;}
  const sc=res&&res.scenario;if(!sc)return;
  _pendingTopic=sc;
  sendData({type:"topic_propose",scenario:sc});
  // show waiting toast on my screen
  showTopicToast(`Waiting for ${m.partner_name} to accept the new topic\u2026`,null,null);
}
function onTopicProposed(sc){
  // partner proposed a new topic - show confirm/reject
  _pendingTopic=sc;
  showTopicToast(`Your partner suggests a new topic: "${sc.t}". Switch?`,
    ()=>{sendData({type:"topic_accept",scenario:sc});applyNewTopic(sc);},
    ()=>{sendData({type:"topic_reject"});_pendingTopic=null;clearTopicToast();});
}
function onTopicRejected(){showTopicToast("Partner declined the new topic.",null,null);setTimeout(clearTopicToast,2000);}
function applyNewTopic(sc){
  clearTopicToast();_pendingTopic=null;
  if(!_curMatch)return;
  // rebuild the roleplay card with new scenario; keep the call/timer running
  const nm=Object.assign({},_curMatch,{scenario:sc});
  // flip sides so it's fresh: proposer keeps a, but we can just keep my_side
  _curMatch=nm;
  refreshRoleplayCard(sc,nm.my_side);
}
function refreshRoleplayCard(sc,mySide){
  const meSideA=mySide==="a";
  const myRole=meSideA?sc.a:sc.b, mySecret=meSideA?sc.sa:sc.sb, theirRole=meSideA?sc.b:sc.a;
  // find the topic card container (first .card after the avatar). We tagged it by id below.
  const host=document.getElementById("rpcard");
  if(host){host.innerHTML=`<div style="font-size:10px;letter-spacing:.08em;color:var(--mut2);margin-bottom:6px;">\uD83C\uDFAD ROLEPLAY \u00B7 ${sc.t}</div>
    <div style="font-size:14px;line-height:1.5;color:var(--navy);margin-bottom:10px;">${sc.s}</div>
    <div style="background:var(--goldbg);border-radius:10px;padding:10px 12px;margin-bottom:8px;">
      <div style="font-size:11px;color:var(--golddk);font-weight:600;">YOU ARE: ${myRole}</div>
      <div style="font-size:13px;color:var(--navy);margin-top:4px;">\uD83E\uDD2B Your goal: ${mySecret}</div></div>
    <div style="font-size:11px;color:var(--mut);">Partner is: ${theirRole}</div>`;}
}
function showTopicToast(text,onYes,onNo){
  clearTopicToast();
  const t=document.createElement("div");t.id="topictoast";
  t.style.cssText="position:fixed;bottom:80px;left:50%;transform:translateX(-50%);max-width:440px;width:92%;background:var(--navy);color:#fff;border-radius:12px;padding:12px 14px;z-index:9998;box-shadow:0 4px 16px rgba(0,0,0,.25);";
  t.innerHTML=`<div style="font-size:13px;margin-bottom:${(onYes||onNo)?'10px':'0'};">${text}</div>`;
  if(onYes||onNo){const row=document.createElement("div");row.style.cssText="display:flex;gap:8px;";
    const y=document.createElement("button");y.className="btn btn-green";y.style.cssText="padding:8px;font-size:13px;";y.textContent="Switch topic";y.onclick=onYes;
    const n=document.createElement("button");n.className="btn";n.style.cssText="padding:8px;font-size:13px;";n.textContent="No thanks";n.onclick=onNo;
    row.appendChild(y);row.appendChild(n);t.appendChild(row);}
  document.body.appendChild(t);
}
function clearTopicToast(){const t=document.getElementById("topictoast");if(t)t.remove();}

async function connectVoice(room,statusFn){
  const setStat=(t)=>{const e=statusFn&&statusFn();if(e)e.textContent=t;};
  try{await navigator.mediaDevices.getUserMedia({audio:true});}catch(e){setStat("\uD83D\uDD07 Allow microphone to talk");return;}
  try{const r=await api("/token",{uid:UID,name:NAME,room:room});if(!r.token){setStat("Voice unavailable");return;}
    lkRoom=new LivekitClient.Room({adaptiveStream:true,dynacast:true});
    lkRoom.on(LivekitClient.RoomEvent.TrackSubscribed,(track)=>{if(track.kind==="audio"){const a=track.attach();a.autoplay=true;document.body.appendChild(a);}});
    lkRoom.on(LivekitClient.RoomEvent.ParticipantDisconnected,()=>{window.__partnerGone&&window.__partnerGone();});
    lkRoom.on(LivekitClient.RoomEvent.DataReceived,(payload)=>{try{const d=JSON.parse(new TextDecoder().decode(payload));
      if(d.type==="reaction")showReaction(d.s,false);
      else if(d.type==="topic_propose")onTopicProposed(d.scenario);
      else if(d.type==="topic_reject")onTopicRejected();
      else if(d.type==="topic_accept")applyNewTopic(d.scenario);
    }catch(e){}});
    await lkRoom.connect(r.url,r.token);await lkRoom.localParticipant.setMicrophoneEnabled(true);
    setStat("\uD83C\uDF99 Voice connected \u2014 speak!");
  }catch(e){setStat("Voice error \u2014 try Skip");}
}
function disconnectVoice(){try{if(lkRoom){lkRoom.disconnect();lkRoom=null;}}catch(e){}}

  scr.innerHTML=`<div class="center" style="padding-top:50px;">${avatar(r.from_name,r.from_photo,80)}

    <div style="font-size:14px;margin:14px 0 20px;">${rp?'invited you to a Roleplay \uD83C\uDFAD':'wants to practice with you \uD83C\uDF99'}</div>
    <button class="btn btn-green" id="acc" style="margin-bottom:10px;"><i class="ti ti-check"></i> Accept</button>
    <button class="btn btn-red" id="rej"><i class="ti ti-x"></i> Reject</button></div>`;
  document.getElementById("acc").onclick=async()=>{const res=await api("/request_respond",{uid:UID,name:NAME,photo:PHOTO,level:myLevel,accept:true});if(res.accepted){callScreen(res);}else{go("speak");}};
  document.getElementById("rej").onclick=async()=>{await api("/request_respond",{uid:UID,accept:false});go("speak");};
}

const ADMIN_UID="960055324";

// ─── Notifications ───
async function refreshBell(){
  try{const r=await api("/notif_count",{uid:UID});const dot=document.getElementById("belldot");if(dot)dot.style.display=(r.count>0)?"block":"none";}catch(e){}
}
setInterval(refreshBell,45000);refreshBell();

async function notifScreen(){
  document.getElementById("nav").style.display="none";
  scr.innerHTML=`<button class="btn" style="width:auto;padding:7px 14px;font-size:13px;border:none;color:var(--mut);margin-bottom:10px;" onclick="go('speak')">\u2039 Back</button><h2>Notifications</h2>
    <div id="pendrev"></div>
    <div id="ntlist" style="margin-top:14px;"><div class="sub" style="text-align:center;padding:20px;">Loading\u2026</div></div>`;
  await api("/notif_seen",{uid:UID});refreshBell();
  // admin: show pending reviews to approve
  if(UID===ADMIN_UID){loadPendingReviews();}
  let res;try{res=await api("/notifs",{uid:UID});}catch(e){}
  const list=(res&&res.notifs)||[];
  const box=document.getElementById("ntlist");
  if(!list.length){box.innerHTML=`<div class="sub" style="text-align:center;padding:30px;">No notifications yet.</div>`;return;}
  box.innerHTML=list.map(n=>{
    let txt="",icon="ti-bell",act="";
    if(n.kind==="like"){txt="liked you";icon="ti-heart";}
    else if(n.kind==="rating"){txt=`rated you ${n.extra||""}\u2B50`;icon="ti-star";}
    else if(n.kind==="follow_accepted"){txt="accepted your follow request";icon="ti-user-check";}
    else if(n.kind==="review_approved"){txt="Your review was approved \u2705";icon="ti-message-check";}
    else if(n.kind==="follow_request"){txt="wants to follow you";icon="ti-user-plus";
      if(n.pending){act=`<div class="row" style="gap:6px;margin-top:6px;"><button class="btn btn-green" style="padding:6px 14px;font-size:12px;width:auto;" onclick="acceptFollow('${n.from_uid}',this)">Accept</button><button class="btn" style="padding:6px 14px;font-size:12px;width:auto;" onclick="rejectFollow('${n.from_uid}',this)">Reject</button></div>`;}
      else{txt="wants to follow you (handled)";}}
    const who=n.kind==="review_approved"?"":`<b>${escapeHtml(n.from_name||"Someone")}</b> `;
    return `<div class="row" style="align-items:flex-start;gap:10px;padding:11px 8px;border-bottom:1px solid var(--line);">
      ${n.kind==="review_approved"?'<div class="cbtn" style="width:38px;height:38px;"><i class="ti '+icon+'" style="color:var(--gold);"></i></div>':avatar(n.from_name,n.from_photo,38)}
      <div style="flex:1;"><div style="font-size:13px;color:var(--navy);"><i class="ti ${icon}" style="color:var(--gold);margin-right:4px;"></i>${who}${txt}</div><div style="font-size:11px;color:var(--mut2);">${n.created||""}</div>${act}</div></div>`;
  }).join("");
}
async function loadPendingReviews(){
  let res;try{res=await api("/reviews_pending",{uid:UID});}catch(e){}
  const revs=(res&&res.reviews)||[];
  const box=document.getElementById("pendrev");if(!box)return;
  if(!revs.length){box.innerHTML="";return;}
  box.innerHTML=`<div style="background:var(--goldbg);border-radius:12px;padding:12px;margin-bottom:8px;">
    <div style="font-size:12px;font-weight:600;color:var(--golddk);margin-bottom:8px;">\uD83D\uDCDD ${revs.length} review${revs.length>1?'s':''} awaiting your approval</div>
    ${revs.map(r=>`<div class="card" style="padding:11px;margin-bottom:8px;" id="prev${r.id}">
      <div class="row" style="gap:8px;margin-bottom:5px;">${avatar(r.name,r.photo_url,30)}<div style="flex:1;"><div style="font-size:13px;font-weight:600;">${escapeHtml(r.name)}</div><div style="font-size:11px;">${"\u2B50".repeat(Math.max(1,Math.min(5,r.stars||5)))}</div></div></div>
      <div style="font-size:13px;color:var(--navy);margin-bottom:8px;">${escapeHtml(r.text)}</div>
      <div class="row" style="gap:8px;"><button class="btn btn-green" style="padding:7px;font-size:12px;" onclick="moderateReview(${r.id},'approve')">\u2705 Approve</button><button class="btn btn-red" style="padding:7px;font-size:12px;" onclick="moderateReview(${r.id},'reject')">\u274C Reject</button></div>
    </div>`).join("")}</div>`;
}
async function moderateReview(id,action){
  await api("/review_moderate",{uid:UID,id:id,action:action});
  const el=document.getElementById("prev"+id);
  if(el)el.innerHTML=`<div style="text-align:center;padding:10px;font-size:12px;color:${action==='approve'?'var(--green)':'var(--mut)'};">${action==='approve'?'\u2705 Approved — now public':'\u274C Rejected'}</div>`;
}
async function acceptFollow(follower,btn){await api("/follow_accept",{uid:UID,name:NAME,photo:PHOTO,follower_uid:follower});btn.parentElement.innerHTML='<span class="sub" style="color:var(--green);">Accepted \u2713</span>';}
async function rejectFollow(follower,btn){await api("/follow_reject",{uid:UID,follower_uid:follower});btn.parentElement.innerHTML='<span class="sub">Rejected</span>';}

async function chatScreen(){
  document.getElementById("nav").style.display="flex";
  scr.innerHTML=`<h2>Community</h2><div class="sub">Say hi, plan a session, share tips</div>
    <div id="msgs" style="margin-top:14px;display:flex;flex-direction:column;gap:8px;max-height:60vh;overflow-y:auto;"><div class="sub" style="text-align:center;padding:20px;">Loading\u2026</div></div>
    <div class="row" style="gap:8px;margin-top:12px;position:sticky;bottom:0;background:var(--bg);padding:8px 0;">
      <input id="msgin" maxlength="300" placeholder="Write a message\u2026" style="flex:1;border:1px solid var(--line);border-radius:20px;padding:10px 14px;font-size:14px;color:var(--navy);"/>
      <button class="btn btn-gold" id="sendmsg" style="width:auto;padding:10px 18px;"><i class="ti ti-send"></i></button></div>`;
  await loadMessages();
  document.getElementById("sendmsg").onclick=sendMsg;
  document.getElementById("msgin").addEventListener("keydown",e=>{if(e.key==="Enter")sendMsg();});
}
async function loadMessages(){
  let res;try{res=await api("/messages",{});}catch(e){}
  const msgs=(res&&res.messages)||[];
  const box=document.getElementById("msgs");if(!box)return;
  if(!msgs.length){box.innerHTML=`<div class="sub" style="text-align:center;padding:20px;">No messages yet. Be the first!</div>`;return;}
  box.innerHTML=msgs.map(x=>{
    const mine=x.uid===UID;
    const del=(UID===ADMIN_UID)?`<span onclick="delMsg(${x.id})" style="color:var(--red);font-size:11px;cursor:pointer;margin-left:6px;">delete</span>`:"";
    return `<div class="row" style="align-items:flex-start;gap:8px;">${avatar(x.name,x.photo_url,30)}<div style="flex:1;background:${mine?'var(--goldbg)':'var(--card)'};border:1px solid var(--line);border-radius:10px;padding:8px 11px;"><div style="font-size:12px;font-weight:600;color:var(--navy);">${x.name}${del}</div><div style="font-size:14px;color:var(--navy);margin-top:2px;word-break:break-word;">${escapeHtml(x.text)}</div><div style="font-size:10px;color:var(--mut2);margin-top:2px;">${x.created}</div></div></div>`;
  }).join("");
  box.scrollTop=box.scrollHeight;
}
function escapeHtml(s){return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
async function sendMsg(){
  const inp=document.getElementById("msgin");const t=inp.value.trim();if(!t)return;
  inp.value="";
  const res=await api("/post",{uid:UID,name:NAME,photo:PHOTO,text:t});
  const box=document.getElementById("msgs");
  if(res&&res.messages&&box){await loadMessages();}
}
async function delMsg(id){await api("/delmsg",{uid:UID,id:id});await loadMessages();}

async function friendsScreen(){
  document.getElementById("nav").style.display="flex";
  scr.innerHTML=`<button class="btn" style="width:auto;padding:7px 14px;font-size:13px;border:none;color:var(--mut);margin-bottom:10px;" onclick="go('profile')">\u2039 Profile</button><h2 style="margin-bottom:4px;">My Friends</h2><div class="sub">People you follow \u2014 tap to call</div>
    <div id="frl" style="margin-top:14px;"><div class="sub" style="text-align:center;padding:20px;">Loading\u2026</div></div>`;

  }).join("");
}

async function profileScreen(){
  scr.innerHTML=`<div class="sub" style="text-align:center;padding:30px;">Loading\u2026</div>`;
  let res;try{res=await api("/profile",{uid:UID});}catch(e){}
  const p=(res&&res.profile)||{name:NAME,minutes:0,total_calls:0,likes_received:0,avg_rating:null,level:myLevel,bio:"",history:[]};
  if(p.level)myLevel=p.level;
  scr.innerHTML=`<div class="center" style="margin-bottom:16px;">${avatar(p.name||NAME,PHOTO,76)}
    <h2 style="margin-top:10px;">${p.name||NAME}</h2><div style="font-size:13px;color:var(--gold);">\u2605 ${p.avg_rating||"New"} \u00B7 ${lvlName(p.level||myLevel)}</div>
    <div class="row" style="gap:24px;margin-top:10px;justify-content:center;">
      <div style="text-align:center;cursor:pointer;" onclick="followListScreen('${UID}','followers','You')"><div style="font-size:18px;font-weight:600;">${p.followers||0}</div><div style="font-size:11px;color:var(--mut);">followers</div></div>
      <div style="text-align:center;cursor:pointer;" onclick="followListScreen('${UID}','following','You')"><div style="font-size:18px;font-weight:600;">${p.following||0}</div><div style="font-size:11px;color:var(--mut);">following</div></div>
    </div>
    ${p.bio?'<div class="sub" style="font-style:italic;margin-top:8px;max-width:260px;">\u201C'+p.bio+'\u201D</div>':''}</div>
    <div class="row" style="gap:10px;margin-bottom:16px;">
      <div class="card" style="flex:1;padding:12px;text-align:center;"><div style="font-size:22px;font-weight:600;">${p.minutes||0}</div><div style="font-size:11px;color:var(--mut);">minutes</div></div>
      <div class="card" style="flex:1;padding:12px;text-align:center;"><div style="font-size:22px;font-weight:600;">${p.total_calls||0}</div><div style="font-size:11px;color:var(--mut);">calls</div></div>
      <div class="card" style="flex:1;padding:12px;text-align:center;"><div style="font-size:22px;font-weight:600;">${p.likes_received||0}</div><div style="font-size:11px;color:var(--mut);">\u2764 likes</div></div></div>
    <div class="card">
      <div style="padding:13px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;cursor:pointer;" onclick="friendsScreen()"><span><i class="ti ti-users" style="color:var(--gold);"></i> My Friends</span><span style="color:var(--mut2);">\u203A</span></div>
      <div style="padding:13px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;cursor:pointer;" onclick="go('ranks')"><span><i class="ti ti-trophy" style="color:var(--gold);"></i> Leaderboard</span><span style="color:var(--mut2);">\u203A</span></div>
      <div style="padding:13px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;cursor:pointer;" onclick="historyScreen()"><span><i class="ti ti-history" style="color:var(--gold);"></i> Call History</span><span style="color:var(--mut2);">\u203A</span></div>
      <div style="padding:13px 14px;display:flex;justify-content:space-between;cursor:pointer;" onclick="settingsScreen()"><span><i class="ti ti-settings" style="color:var(--gold);"></i> Settings</span><span style="color:var(--mut2);">\u203A</span></div>
    </div>`;
}

async function historyScreen(){
  document.getElementById("nav").style.display="flex";
  scr.innerHTML=`<div class="sub" style="text-align:center;padding:20px;">Loading\u2026</div>`;
  let res;try{res=await api("/profile",{uid:UID});}catch(e){}
  const h=(res&&res.profile&&res.profile.history)||[];
  const rows=h.map(x=>`<div class="row" style="padding:11px 14px;border-bottom:1px solid var(--line);"><div style="flex:1;"><div style="font-size:14px;">${x.partner_name||"Partner"}</div><div style="font-size:11px;color:var(--mut);">${x.ended_at||""} \u00B7 ${lvlName(x.level)}</div></div><div style="font-size:13px;color:var(--mut);">${fmt(x.seconds||0)}</div></div>`).join("")||'<div class="sub" style="padding:20px;text-align:center;">No calls yet</div>';

function settingsScreen(){
  document.getElementById("nav").style.display="flex";
  scr.innerHTML=`<button class="btn" style="width:auto;padding:7px 14px;font-size:13px;border:none;color:var(--mut);margin-bottom:10px;" onclick="go('profile')">\u2039 Profile</button><h2 style="margin-bottom:14px;">Settings</h2>
    <div class="sub" style="margin-bottom:8px;">Your level</div><div id="lvls" style="display:flex;flex-direction:column;gap:8px;margin-bottom:20px;"></div>
    <div class="sub" style="margin-bottom:8px;">Your bio <span style="color:var(--mut2);">(shown on your profile)</span></div>
    <textarea id="bio" rows="3" maxlength="200" placeholder="e.g. IELTS 7 goal \uD83C\uDFAF Love talking about travel & films"></textarea>
    <button class="btn btn-gold" id="savebio" style="margin-top:10px;">Save bio</button>
    <div class="sub" id="saved" style="text-align:center;margin-top:10px;color:var(--green);"></div>`;
  const lv=document.getElementById("lvls");
  LEVELS.forEach(([id,label])=>{const b=document.createElement("button");b.className="btn";b.style.textAlign="left";
    if(id===myLevel){b.style.borderColor="var(--gold)";b.style.background="var(--goldbg)";}
    b.innerHTML=(id===myLevel?'<i class="ti ti-check" style="color:var(--gold);margin-right:8px;"></i>':'<span style="margin-right:24px;"></span>')+label;
    b.onclick=async()=>{myLevel=id;localStorage.setItem("sp_level",id);await api("/setlevel",{uid:UID,level:id});settingsScreen();};lv.appendChild(b);});
  api("/profile",{uid:UID}).then(r=>{if(r.profile&&r.profile.bio)document.getElementById("bio").value=r.profile.bio;});
  document.getElementById("savebio").onclick=async()=>{await api("/setbio",{uid:UID,bio:document.getElementById("bio").value});document.getElementById("saved").textContent="Saved!";};
}

// ─── Auto-update: check version, reload on safe screens when it changes ───
let CURRENT_VERSION=null, currentTab="speak", inCall=false;
async function checkVersion(){
  try{const r=await api("/version",{});
    if(CURRENT_VERSION===null){CURRENT_VERSION=r.version;return;}
    if(r.version!==CURRENT_VERSION){
      if(!inCall && (currentTab==="speak"||currentTab==="profile")){location.reload();}
      else{showUpdateBanner();}
    }
  }catch(e){}
}
function showUpdateBanner(){
  if(document.getElementById("updbanner"))return;
  const b=document.createElement("div");
  b.id="updbanner";
  b.style.cssText="position:fixed;top:0;left:50%;transform:translateX(-50%);max-width:480px;width:100%;background:var(--gold);color:#fff;text-align:center;padding:10px;font-size:13px;font-weight:600;z-index:9999;cursor:pointer;";
  b.textContent="🔄 Update available — tap to refresh";
  b.onclick=()=>location.reload();
  document.body.appendChild(b);
}
setInterval(checkVersion,60000);
checkVersion();

go("speak");
</script>
